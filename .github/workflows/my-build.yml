name: my-build
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: microsoft/setup-msbuild@v2
      - shell: cmd
        run: build.bat
      - uses: actions/upload-artifact@v4
        with:
          name: VNTranslationTools
          path: Build
